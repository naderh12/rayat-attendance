<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تحضير رايات</title>

<style>
body{
    font-family:Tahoma;
    padding:30px;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:800px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}
</style>

</head>

<body>

<div class="card">

<h1>تحضير رايات</h1>

<input type="file" id="excelFile" accept=".xlsx">

<br><br>

<button onclick="createSession()">
إنشاء جلسة
</button>

<div id="result"></div>

</div>

<script>

function createSession(){

    document.getElementById("result").innerHTML = `
    <p>تم إنشاء جلسة تجريبية بنجاح ✅</p>
    `;

}

</script>

</body>

</html>
