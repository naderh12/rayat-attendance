<head>

<body>

<div class="card">

</button>

<div id="qrcode"></div>

الحضور الحالي: 0
</div>

<div class="footer">

</div>

<script>
const SUPABASE_URL='https://paimizculszksstmcfsq.supabase.co';

const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhaW1pemN1bHN6a3NzdG1jZnNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MDk4NTYsImV4cCI6MjEwNTM4NTg1Nn0.9MlGrXKL745jPWygSuOSWVh-eLX-sR565zHYDRuufK0';
</script>
<script src="js/app.js"></script>
<script>

async function loadAttendance(){

try{

const currentSession =
localStorage.getItem('sessionId');

if(!currentSession){

document.getElementById('attendanceCount').innerHTML =
'الحضور الحالي: 0';

document.getElementById('attendanceList').innerHTML =
'لا يوجد حضور حتى الآن';

return;

}

const response =
await fetch(
`${SUPABASE_URL}/rest/v1/attendance_temp?session_id=eq.${currentSession}`,
{
headers:{
apikey: SUPABASE_KEY,
Authorization: `Bearer ${SUPABASE_KEY}`
}
}
);

const data =
await response.json();

if(!Array.isArray(data)){

document.getElementById('attendanceCount').innerHTML =
'الحضور الحالي: 0';

return;

}

document.getElementById('attendanceCount').innerHTML =
`الحضور الحالي: ${data.length}`;

let html = '';

if(data.length === 0){

html = 'لا يوجد حضور حتى الآن';

}else{

data.forEach(item => {

html += `
<div class="student">
${item.student_id}
</div>
`;

});

}

document.getElementById('attendanceList').innerHTML =
html;

}
catch(error){

console.error(error);

}

}

setInterval(loadAttendance,3000);

loadAttendance();

</script>

</body>
