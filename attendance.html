<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الحضور</title>

<style>

body{
font-family:Tahoma;
padding:20px;
text-align:center;
}

h2{
margin-top:50px;
}

input{
padding:12px;
font-size:22px;
width:250px;
}

button{
padding:12px 25px;
font-size:22px;
cursor:pointer;
}

#msg{
margin-top:20px;
font-size:20px;
font-weight:bold;
}

</style>

</head>

<body>

<h2>تسجيل الحضور</h2>

<input
id="sid"
placeholder="الرقم التدريبي">

<button onclick="save()">
تسجيل
</button>

<div id="msg"></div>

js/supabase.jsscript>

<script>

const params =
new URLSearchParams(
window.location.search
);

const sessionId =
params.get("session");

async function save(){

const studentId =
document
.getElementById("sid")
.value
.trim();

if(!studentId){

document
.getElementById("msg")
.innerHTML =
"أدخل الرقم التدريبي";

return;

}

try{

const result =
await addAttendance(
sessionId,
studentId
);

if(result.ok){

document
.getElementById("msg")
.innerHTML =
"✅ تم تسجيل الحضور بنجاح";

}
else{

document
.getElementById("msg")
.innerHTML =
"❌ فشل تسجيل الحضور";

}

}
catch(error){

document
.getElementById("msg")
.innerHTML =
"❌ خطأ في الاتصال";

console.error(error);

}

}

</script>

</body>
</html>
