<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تحضير رايات</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lsx.full.min.jsscript>

<style>

body{
font-family:Tahoma;
padding:30px;
background:#f5f5f5;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
max-width:800px;
}

h1{
margin-top:0;
}

#studentsCount{
font-size:20px;
color:green;
}

</style>

</head>

<body>

<div class="card">

<h1>رفع ملف رايات</h1>

<input type="file" id="excelFile" accept=".xlsx">

<br><br>

<div id="studentsCount"></div>

<div id="courseInfo"></div>

</div>

<script>

document
.getElementById("excelFile")
.addEventListener("change", handleFile);

function handleFile(event){

const file = event.target.files[0];

const reader = new FileReader();

reader.onload = function(e){

const data = new Uint8Array(
e.target.result
);

const workbook =
XLSX.read(
data,
{type:'array'}
);

const worksheet =
workbook.Sheets[
workbook.SheetNames[0]
];

const rows =
XLSX.utils.sheet_to_json(
worksheet
);

document.getElementById(
"studentsCount"
).innerHTML =
"عدد الطلاب: "
+
rows.length;

if(rows.length > 0){

document.getElementById(
"courseInfo"
).innerHTML =
`
<p>CRN :
${rows[0]["CRN"]}</p>

<p>Meeting ID :
${rows[0]["Meeting ID"]}</p>
`;

}

console.log(rows);

}

reader.readAsArrayBuffer(file);

}

</script>

</body>

</html>
