<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>تسجيل الحضور</title><style>body{font-family:Tahoma;padding:20px}</style></head><body><h2>تسجيل الحضور</h2><input id="sid" placeholder="الرقم التدريبي"><button onclick="save()">تسجيل</button><div id="msg"></div><script>function save(){let id=document.getElementById('sid').value;if(!id){return;}let arr=JSON.parse(localStorage.getItem('attendees')||'[]');if(arr.includes(id)){msg.innerHTML='تم التسجيل مسبقا';return;}arr.push(id);localStorage.setItem('attendees',JSON.stringify(arr));msg.innerHTML='تم تسجيل الحضور بنجاح';}</script></body></html>
