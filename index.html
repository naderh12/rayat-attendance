<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحضير رايات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-family:Tahoma;background:#f5f5f5;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;max-width:1000px;margin:auto}
.info{background:#eef7ff;padding:10px;margin-top:10px;border-radius:8px}
#attendanceBox{margin-top:20px;padding:15px;background:#f8f8f8;border-radius:10px}
#attendanceList{max-height:300px;overflow:auto}
.student{padding:6px;border-bottom:1px solid #ddd}
</style>
</head>
<body>
<div class="card">
<h1>تحضير رايات</h1>
<input type="file" id="excelFile">
<div id="fileInfo" class="info">قم باختيار ملف رايات</div>
<button id="openBtn">فتح الحضور</button>
<div id="sessionInfo"></div>
<div id="qrcode"></div>
<div id="studentList"></div>
<hr>
<div id="attendanceBox">
<h2>الحضور المباشر</h2>
<div id="attendanceCount">الحضور الحالي: 0</div>
<br>
<div id="attendanceList">لا يوجد حضور حتى الآن</div>
</div>
</div>
<script src="js/app.js"></script>
<script>
const SUPABASE_URL='https://paimizculszksstmcfsq.supabase.co';
const SUPABASE_KEY='REPLACE_WITH_YOUR_ANON_KEY';
async function loadAttendance(){
try{
const response=await fetch(`${SUPABASE_URL}/rest/v1/attendance_temp`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
const data=await response.json();
document.getElementById('attendanceCount').innerHTML=`الحضور الحالي: ${data.length}`;
let html='';
if(data.length===0){html='لا يوجد حضور حتى الآن';}
else{data.forEach(item=>{html+=`<div class="student">${item.student_id}</div>`})}
document.getElementById('attendanceList').innerHTML=html;
}catch(e){console.error(e)}
}
setInterval(loadAttendance,3000);
loadAttendance();
</script>
</body>
</html>
